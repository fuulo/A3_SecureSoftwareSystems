# Edge load balancer for the API (R-07).
#
# Terminates TLS 1.3 from clients, filters and rate-limits traffic per client
# address, and spreads requests over the healthy API instances, re-encrypting
# to each one. Instances are checked every 2 seconds; one that fails twice
# gets no traffic until it passes twice.
#
# The EDGE_* limits come from docker-compose.yml.

global
    log stdout format raw local0
    maxconn 20000
    # Same versions and ciphers as tls-policy.json, towards clients and towards the API
    ssl-default-bind-options ssl-min-ver TLSv1.3
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    ssl-default-server-options ssl-min-ver TLSv1.3
    ssl-default-server-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

# Docker's DNS: "api" resolves to every running API container
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
    accepted_payload_size 8192

crt-store certs
    crt-base /certs
    key-base /certs
    load crt "localhost.pem" key "localhost-key.pem"

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # Clients that send slowly or sit idle (slowloris) are cut off instead of holding connections
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout client 30s
    timeout connect 5s
    timeout server 30s
    timeout queue 10s
    # A request that could not reach an instance goes to another one. Nothing an
    # instance has received is resent, so a ballot is never submitted twice.
    retries 2
    option redispatch 1
    # JSON bodies, as the frontend expects from the API
    http-error status 400 content-type application/json string '{"detail":"Bad request"}'
    http-error status 403 content-type application/json string '{"detail":"Request blocked"}'
    http-error status 404 content-type application/json string '{"detail":"Not found"}'
    http-error status 405 content-type application/json string '{"detail":"Method not allowed"}'
    http-error status 413 content-type application/json string '{"detail":"Request too large"}'
    http-error status 429 content-type application/json string '{"detail":"Too many requests"}' hdr Retry-After 10
    http-error status 503 content-type application/json string '{"detail":"Service temporarily unavailable"}' hdr Retry-After 5

frontend api_edge
    bind :8443 ssl crt "@certs/localhost.pem" alpn http/1.1
    maxconn 10000

    # Per-client counters, dropped 60 seconds after the client's last activity
    stick-table type ipv6 size 200k expire 60s store conn_cur,conn_rate(10s),http_req_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt "${EDGE_MAX_CONNECTIONS_PER_CLIENT}" }
    tcp-request connection reject if { sc_conn_rate(0) gt "${EDGE_MAX_NEW_CONNECTIONS_PER_10S}" }

    # Traffic filtering: only the methods, paths and sizes the API serves
    acl allowed_method method GET HEAD POST PATCH DELETE OPTIONS
    acl api_path path_beg /api/
    acl health_path path /health
    http-request deny deny_status 405 unless allowed_method
    http-request deny deny_status 404 unless api_path or health_path
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 1048576 }

    http-request deny deny_status 429 if { sc_http_req_rate(0) gt "${EDGE_MAX_REQUESTS_PER_10S}" }

    # The API reads the client address from this header (TRUST_PROXY_HEADERS),
    # so it is replaced, never appended to
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https

    default_backend api

backend api
    balance leastconn
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    # Requests above maxconn wait in a queue (timeout queue) instead of overloading an instance
    default-server inter 2s fall 2 rise 2 maxconn 200 on-marked-down shutdown-sessions check resolvers docker init-addr none ssl verify required ca-file /certs/ca.pem verifyhost localhost sni str(localhost) check-sni localhost alpn http/1.1
    # One slot per instance; "docker compose up --scale api=N" fills N of them
    server-template api 10 api:8000

# Live status of every instance; published on 127.0.0.1 only. Read by
# infra/uptime_monitor.py and infra/autoscale.py.
frontend stats
    bind :8404
    http-request set-log-level silent
    stats enable
    stats uri /stats
    stats refresh 5s
